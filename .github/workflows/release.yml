name: Release

# 推送 v* 标签时自动：跑测试 → 打包 → 创建 Release
on:
  push:
    tags:
      - 'v*'

# gh release create 需要写权限
permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 测试不过就不出包，避免把坏版本发出去
      - name: Test before release
        run: python -m unittest discover -s tests -v

      - name: Build archives
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # 用 git archive 而非 zip -r：只含已跟踪文件，
          # 且能保留 start.command 的可执行权限位
          git archive --format=tar.gz \
            --prefix="CleanYourMac-${VERSION}/" HEAD \
            -o "dist/CleanYourMac-${VERSION}.tar.gz"
          git archive --format=zip \
            --prefix="CleanYourMac-${VERSION}/" HEAD \
            -o "dist/CleanYourMac-${VERSION}.zip"

          echo "### 打包结果" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify archive contents
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="dist/CleanYourMac-${VERSION}.tar.gz"

          # 确保没有把本地运行时文件或密钥打进包
          if tar -tzf "$PKG" | grep -E 'data\.json|deletes\.log|targets\.local\.json|\.workbuddy|/\.git/|\.claude/|__pycache__'; then
            echo "::error::发布包内出现不应提交的文件"
            exit 1
          fi

          # 隐私检查：源码与文档里不得出现本机用户名或家目录绝对路径
          # （/Users/<name>、/home/<name>），避免把个人环境信息发出去。
          #
          # 注意：macOS 自带的是 bsdtar，**不支持 --wildcards**；用它会让 tar
          # 直接失败，而错误被 2>/dev/null 吞掉后 grep 拿到空输入，检查反而
          # 「通过」。所以这里先解包到临时目录再 grep，并开启 pipefail，
          # 任何一步失败都中止发布。
          set -o pipefail
          TMP_CHECK="$(mktemp -d)"
          tar -xzf "$PKG" -C "$TMP_CHECK"
          if grep -rnE '/Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+' \
               "$TMP_CHECK" --include='*.py' --include='*.html' \
               --include='*.md' --include='*.json'; then
            rm -rf "$TMP_CHECK"
            echo "::error::发布包内出现家目录绝对路径（含用户名）"
            exit 1
          fi
          # 同时确认 tar 确实解出了文件，避免「检查了个空目录」式的假通过
          COUNT=$(find "$TMP_CHECK" -name '*.py' | wc -l | tr -d ' ')
          rm -rf "$TMP_CHECK"
          if [ "$COUNT" -lt 3 ]; then
            echo "::error::隐私检查没有扫描到足够的源文件（$COUNT 个），检查无效"
            exit 1
          fi
          echo "隐私检查通过（扫描 $COUNT 个 .py 文件）"

          # 新功能文件必须在包里
          for f in uninstaller.py tests/test_uninstall.py; do
            if ! tar -tzf "$PKG" | grep -q "/$f\$"; then
              echo "::error::发布包缺少 $f"
              exit 1
            fi
          done

          # 确保启动脚本保留了可执行位
          PERM=$(tar -tzvf "$PKG" | awk '/start\.command$/ {print $1}')
          echo "start.command 权限: $PERM"
          case "$PERM" in
            -rwx*) echo "权限正确" ;;
            *) echo "::error::start.command 丢失可执行权限"; exit 1 ;;
          esac

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 手动发过的版本再次推同名 tag 时，改为覆盖资产而不是报错
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release 已存在，覆盖资产"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
