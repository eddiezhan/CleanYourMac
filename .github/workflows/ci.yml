name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 是项目声明的最低版本，3.13 是当前稳定版
        python-version: ['3.9', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: |
          python -V
          sw_vers

      - name: Run safety tests
        run: python -m unittest discover -s tests -v

      - name: Verify imports
        run: python -c "import scanner, uninstaller, server; print('imports ok')"

      # 卸载功能会触碰 /Applications 与 ~/Library，这里只做只读扫描，
      # 确认在干净环境里不会抛异常、也不会删除任何东西
      - name: Smoke test app scan (read-only)
        run: |
          python -c "
          import uninstaller
          r = uninstaller.scan_apps()
          print('apps:', r['summary']['count'])
          for a in r['apps']:
              assert 'leftovers' in a and isinstance(a['leftovers'], list)
              for f in a['leftovers']:
                  assert f['default'] == (f['confidence'] != 'fuzzy'), f['path']
          print('scan ok')
          "
